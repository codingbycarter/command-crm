<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bycarter.com — Philadelphia Real Estate CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F1EA;--panel:#FFFFFF;--ink:#101B2D;--muted:#5D6778;--line:#E2DDD2;--chip:#EEE9DE;--gold:#A98228;--gold2:#E3C276;--navy:#0E1A2B;--navy2:#16263D;--red:#B3261E;--green:#1D7A4C;--amber:#B26B00;--shadow:0 1px 2px rgba(16,27,45,.06),0 6px 20px rgba(16,27,45,.06)}
[data-theme=dark]{--bg:#0A101B;--panel:#111A29;--ink:#ECEFF5;--muted:#98A3B6;--line:#22304A;--chip:#18233A;--gold:#D8B35A;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:Oswald,Inter,sans-serif;letter-spacing:.02em;margin:0;font-weight:600}
h1{font-size:28px}h2{font-size:19px;text-transform:uppercase}h3{font-size:15px;text-transform:uppercase;letter-spacing:.05em}
a{color:var(--gold)}button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* shell */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--navy);color:#DDE3EE;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .t1{font-family:Oswald;font-size:18px;letter-spacing:.08em;color:#fff;line-height:1}.brand .t2{font-size:10.5px;letter-spacing:.22em;color:var(--gold2);margin-top:4px}
.nav{padding:10px 8px;flex:1}.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#C9D1DE;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;font-size:13.5px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}.nav button.on{background:linear-gradient(90deg,rgba(227,194,118,.22),rgba(227,194,118,.04));color:#fff;box-shadow:inset 3px 0 0 var(--gold2)}
.nav .sec{font-size:10px;letter-spacing:.2em;color:#7F8CA3;padding:12px 10px 4px}
.nav .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.08);padding:0 7px;border-radius:9px}
.ico{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sidefoot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.sidefoot .row{display:flex;gap:6px;align-items:center;justify-content:space-between}
.sbtn{background:rgba(255,255,255,.07);border:0;color:#DDE3EE;padding:5px 9px;border-radius:7px;cursor:pointer;font-size:12px}
.sbtn:hover{background:rgba(255,255,255,.14)}
.sync{display:flex;align-items:center;gap:6px;margin-top:8px;color:#9EABC0}.dot{width:8px;height:8px;border-radius:50%;background:#7F8CA3}.dot.ok{background:#3BC37A}.dot.warn{background:#E7A93B}
.main{padding:22px 26px 60px;min-width:0}
.topbar{display:none}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:760px}
.kicker{font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:700;text-transform:uppercase}
.tile .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .val{font-family:Oswald;font-size:30px;line-height:1.15;margin-top:4px}.tile .sub{font-size:12px;color:var(--muted)}
.hero{background:radial-gradient(1200px 300px at 85% -40%,rgba(227,194,118,.35),transparent 60%),linear-gradient(135deg,#0E1A2B,#1B2E4B);color:#fff;border:0}
.hero h1{font-size:34px}.hero .quote{color:#E8DCC0;font-style:italic;margin-top:6px;max-width:680px}
.bar{height:10px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),#F4E2B0);border-radius:9px}
.card .bar{background:var(--chip)}.card .bar>i{background:linear-gradient(90deg,var(--gold),var(--gold2))}.hero .bar{background:rgba(255,255,255,.14)}.hero .bar>i{background:linear-gradient(90deg,var(--gold2),#F4E2B0)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}[data-theme=dark] .btn.pri{background:var(--gold);color:#111;border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#111}.btn.sm{padding:4px 8px;font-size:12px;border-radius:7px}.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--chip);font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.g{background:rgba(29,122,76,.13);color:var(--green)}.chip.r{background:rgba(179,38,30,.12);color:var(--red)}.chip.a{background:rgba(178,107,0,.13);color:var(--amber)}.chip.k{background:rgba(169,130,40,.16);color:var(--gold)}
.warn{display:inline-block;font-size:11px;color:var(--red);background:rgba(179,38,30,.08);border-radius:6px;padding:0 6px;margin:2px 4px 0 0}
.muted{color:var(--muted)}.small{font-size:12px}.right{text-align:right}.mt{margin-top:14px}.mt2{margin-top:22px}.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--chip);position:sticky;top:0}
tr:last-child td{border-bottom:0}tbody tr:hover{background:rgba(169,130,40,.05)}
td .nm{font-weight:600}.score{font-family:Oswald;font-size:16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input[type=search],.filters select{border:1px solid var(--line);background:var(--panel);padding:7px 10px;border-radius:9px}
.filters input[type=search]{min-width:220px}
.tog{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer}
/* kanban */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}.col{flex:0 0 220px;background:var(--chip);border-radius:12px;padding:8px;min-height:160px}
.col h4{margin:2px 4px 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.col.over{outline:2px dashed var(--gold)}.kc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:grab;font-size:12.5px}
.kc b{display:block;font-size:13px}
/* playbook */
details.pb{margin-bottom:14px}details.pb summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.pb summary::before{content:'▸';color:var(--gold);transition:.15s}details.pb[open] summary::before{transform:rotate(90deg)}
.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.src{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}.src b{display:block}
.legal{border-left:3px solid var(--red);padding:8px 12px;background:rgba(179,38,30,.05);border-radius:0 8px 8px 0;margin-top:10px;font-size:13px}
.note{border-left:3px solid var(--gold);padding:8px 12px;background:rgba(169,130,40,.07);border-radius:0 8px 8px 0;font-size:13px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(8,13,22,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 14px;overflow-y:auto}
.mbox{background:var(--panel);border-radius:16px;width:min(760px,100%);padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mbox.sm{width:min(460px,100%)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin-top:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}.fld.w{grid-column:1/-1}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);padding:8px 10px;border-radius:9px;color:var(--ink);font-weight:400;font-size:14px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;grid-column:1/-1}.chk input{margin-top:3px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
textarea.draft{width:100%;min-height:260px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);font:13.5px/1.55 Inter}
/* toasts */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:60;max-width:380px}
.toast{background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13px}.toast.err{background:var(--red)}
.affirm{background:linear-gradient(135deg,#0E1A2B,#21375A);color:#fff;border:1px solid var(--gold2);border-radius:14px;padding:16px 18px;box-shadow:0 14px 40px rgba(0,0,0,.35);animation:pop .35s ease}
.affirm .k{font-family:Oswald;letter-spacing:.18em;font-size:12px;color:var(--gold2)}.affirm p{font-size:16px;margin:6px 0 12px;line-height:1.45}
@keyframes pop{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
/* login */
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 500px at 70% 0%,rgba(227,194,118,.25),transparent 60%),linear-gradient(160deg,#0B1524,#1A2D4A);padding:20px}
.lbox{width:min(520px,100%);color:#fff;text-align:center}
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.who button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:18px 10px;cursor:pointer}
.who button.on,.who button:hover{border-color:var(--gold2);background:rgba(227,194,118,.12)}
.pin{margin-top:16px;display:flex;gap:8px;justify-content:center}.pin input{width:170px;text-align:center;letter-spacing:.4em;font-size:20px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff}
.perm td,.perm th{padding:7px 10px}
.bars .b{display:grid;grid-template-columns:130px 1fr 90px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.bars .t{height:16px;background:var(--chip);border-radius:6px;overflow:hidden}.bars .t i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),var(--gold))}
.roi input{width:100%;border:1px solid var(--line);background:var(--bg);padding:6px 8px;border-radius:8px}
.roi td,.roi th{padding:7px 10px}.roi td:first-child{font-weight:600;color:var(--muted);font-size:12.5px}
.coachout{white-space:pre-wrap;margin-top:10px;font-size:13.5px}
ul.tight{margin:6px 0;padding-left:18px}ul.tight li{margin:3px 0}
@media (max-width:1100px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){.shell{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-100%);transition:.2s}.side.open{transform:none}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:30}.main{padding:16px 14px 60px}
.g2,.g3{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,1fr)}.fgrid{grid-template-columns:1fr}.hero h1{font-size:26px}}
</style>
</head>

const ymd=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};

const f$=n=>(n==null||isNaN(n))?'—':'$'+Math.round(n).toLocaleString();
const fK=n=>{n=+n||0;const a=Math.abs(n);if(a>=1e6)return '$'+(n/1e6).toFixed(a>=1e7?1:2).replace(/\.0+$|(\.\d)0$/,'$1')+'M';if(a>=1e3)return '$'+Math.round(n/1e3)+'K';return '$'+Math.round(n)};
const fDate=s=>{if(!s)return '—';const d=new Date(s+'T12:00:00');return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})};

const LS='bycarterCRM_v1';
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('acrm:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=7;for(const c of 'acrm:'+s)h=(h*31+c.charCodeAt(0))|0;return 'x'+h}}

const Store={db:null,q:{},
 loadLocal(){try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);S.leads=o.leads||{};S.tasks=o.tasks||{};S.settings=mergeSettings(o.settings)}}catch(e){}},
 saveLocal(){if(S.mode!=='local')return;try{localStorage.setItem(LS,JSON.stringify({leads:S.leads,tasks:S.tasks,settings:S.settings}))}catch(e){}},
 write(key,fn){const prev=this.q[key]||Promise.resolve();const p=prev.then(fn).catch(e=>{const c=e&&e.code;if(c==='invalid_argument'){S.readOnly=true;toast('You have view-only access to the shared data.','err')}else if(c==='quota_exceeded')toast('Storage is full: '+(e.message||'delete old records'),'err');else toast('Save failed — try again ('+(c||e)+')','err');render()});this.q[key]=p;return p},
 put(col,o){(col==='leads'?S.leads:S.tasks)[o.id]=o;if(S.mode==='db')return this.write(col+'/'+o.id,()=>this.db.collection(col).doc(o.id).set(clone(o)));this.saveLocal();return Promise.resolve()},
 del(col,id){delete (col==='leads'?S.leads:S.tasks)[id];if(S.mode==='db')return this.write(col+'/'+id,()=>this.db.collection(col).doc(id).delete());this.saveLocal();return Promise.resolve()},
 putSettings(){if(S.mode==='db')return this.write('crm/settings',()=>this.db.doc('crm/settings').set(clone(S.settings)));this.saveLocal();return Promise.resolve()}};

async function connectCloud(tries=0){
 if(!(window.claude&&typeof window.claude.use==='function')){if(tries<1)return setTimeout(()=>connectCloud(tries+1),600);S.cloud='off';renderShellBits();return}
 try{S.ai=await window.claude.use('sample')}catch(e){S.ai=null}
 let db=null;try{db=await window.claude.use('db')}catch(e){}
 if(!db){S.cloud='off';render();return}
 Store.db=db;S.settingsReady=false;S.localCopy={leads:clone(S.leads),tasks:clone(S.tasks)};S.mode='db';S.cloud='syncing';S.leads={};S.tasks={};
 const timer=setTimeout(()=>{if(S.cloud==='syncing'){S.cloud='slow';renderShellBits()}},10000);
 const got=()=>{if(S.cloud!=='ok'){S.cloud='ok';clearTimeout(timer)}};
 const fail=e=>{clearTimeout(timer);S.cloud='error';toast('Cloud sync stopped ('+(e&&e.code||'error')+'). Reload the page to reconnect.','err');renderShellBits()};
 db.doc('crm/settings').onSnapshot(s=>{if(s.exists)S.settings=mergeSettings(s.data());if(!s.metadata.fromCache){got();S.settingsReady=true}renderSoft()},fail);
 db.collection('leads').onSnapshot(q=>{const m={};q.docs.forEach(d=>{m[d.id]=d.data()});S.leads=m;if(!q.metadata.fromCache)got();renderSoft()},fail);
 db.collection('tasks').onSnapshot(q=>{const m={};q.docs.forEach(d=>{m[d.id]=d.data()});S.tasks=m;if(!q.metadata.fromCache)got();renderSoft()},fail);
 render();
}

/* ============ lead logic ============ */
const leadsOf=c=>Object.values(S.leads).filter(l=>l.cat===c);
const allLeads=()=>Object.values(S.leads);
const closedStages=c=>c==='referral'?['Closed – fee pending','Fee received']:['Closed'];
const deadStages=['Lost','Not now','Re-listed elsewhere','Not pursuing','Inactive','Kept home'];
const isClosed=l=>closedStages(l.cat).includes(l.stage);
const isActive=l=>!isClosed(l)&&!deadStages.includes(l.stage);
function prob(l){const st=CATS[l.cat].stages;const ci=st.indexOf(closedStages(l.cat)[0]);const i=st.indexOf(l.stage);if(i<0||ci<=0)return .05;return Math.max(.05,Math.min(.9,i/ci))}
function gci(l){const S2=S.settings;const v=+l.value||0;const c=(+S2.commissionPct||0)/100;const sp=(+S2.splitPct||0)/100;
 if(l.cat==='referral'){const fee=(+l.feePct||25)/100;return (l.direction||'').startsWith('Inbound')?v*c*(1-fee)*sp:v*c*fee*sp}return v*c*sp}
function warnings(l){const w=[];const st=CATS[l.cat].stages;const i=st.indexOf(l.stage);
 if(l.phone&&!l.dncChecked)w.push('Scrub DNC before calling');
 if(l.cat==='expired'&&!l.verified)w.push('Verify agreement ended before contact');
 if(i>=2&&!l.disclosure&&l.cat!=='referral'&&l.cat!=='investor')w.push(l.state==='PA'?'Give PA Consumer Notice':l.state==='NJ'?'Give NJ CIS':'Give agency disclosure');
 if(l.cat==='buyer'&&i>=st.indexOf('Touring')&&!l.buyerAgreement)w.push('Buyer agreement before touring');
 if(l.cat==='preforeclosure'&&/lease back/i.test(l.path||'')&&!l.attorney)w.push('Lease-back: attorney required');
 if(l.cat==='preforeclosure'&&!l.counselor&&i>=1)w.push('Share free counseling resources');
 if(l.cat==='referral'&&i>=2&&!l.agreement)w.push('Signed referral agreement');
 if(l.cat==='referral'&&i>=1&&!l.partnerLicense)w.push('Verify partner license');
 return w}
function score(l){let s=0;const v=+l.value||0;s+=v>=1e6?35:v>=6e5?25:v>=4e5?15:8;s+=Math.round(prob(l)*30);
 if(l.lastContact){const d=dBetween(l.lastContact,today());s+=d<=7?15:d<=30?8:0}
 if(l.nextFollow&&dBetween(today(),l.nextFollow)<=3)s+=10;
 if(l.cat==='expired'){const w=relistWindow(l);if(w&&w.state==='open')s+=10}
 if(l.cat==='luxury')s+=5;s-=warnings(l).length*6;return Math.max(0,Math.min(100,s))}
function relistWindow(l){if(!l.offDate)return null;const r=RELIST[l.reason||'Unknown']||RELIST.Unknown;const a=addDays(l.offDate,r[0]),b=addDays(l.offDate,r[1]);const t=today();
 return {a,b,state:t<a?'soon':t<=b?'open':'past'}}

function filtered(c){const f=S.f,q=f.q.toLowerCase();return leadsOf(c).filter(l=>(!q||[l.name,l.area,l.notes,l.email,l.county,l.partnerState,l.source].join(' ').toLowerCase().includes(q))&&(!f.stage||l.stage===f.stage)&&(!f.state||l.state===f.state)&&(!f.recent||(l.createdAt&&dBetween(l.createdAt,today())<=30)||(l.offDate&&dBetween(l.offDate,today())<=30))&&(!f.lux||(+l.value||0)>=1e6)&&(!f.warn||warnings(l).length)).sort((a,b)=>score(b)-score(a))}

 if(c==='investor')return `${esc(l.strategy||'')}<br><span class="small muted">${l.minPrice?fK(l.minPrice)+'–':'≤'}${fK(l.value)} · ${l.pof?'POF ✓':'no POF'}</span>`;

const extraHead={expired:'Off market / ready',preforeclosure:'Path / sale',referral:'Route / fee',investor:'Buy box',commercial:'Type',development:'Zoning',buyer:'Agreement',luxury:'Side',seller:'Motivation'};

 return `<div class="tablewrap"><table><thead><tr><th>Score</th><th>Name</th><th>Stage</th><th>Value</th><th>Location</th><th>${extraHead[c]}</th><th>Next touch</th><th></th></tr></thead><tbody>${rows.map(l=>{const w=warnings(l);const nf=l.nextFollow;return `<tr>

 <td><div class="nm">${esc(l.name)}</div><div class="small muted">${esc(l.source||'')}</div>${w.map(x=>`<span class="warn">${esc(x)}</span>`).join('')}</td>
 <td><span class="chip">${esc(l.stage)}</span></td><td>${fK(l.value)}</td><td>${esc(l.area||'')}<div class="small muted">${esc([l.county,l.state].filter(Boolean).join(', '))}</div></td>
 <td class="small">${extraCell(l)}</td><td>${nf?`<span class="chip ${nf<today()?'r':nf===today()?'a':''}">${fDate(nf)}</span>`:'—'}</td>
 <td class="right"><div class="flex" style="justify-content:flex-end;flex-wrap:nowrap"><button class="btn sm" data-act="draft" data-id="${l.id}">Draft</button>${ed?`<button class="btn sm" data-act="logTouch" data-id="${l.id}" title="Log a contact today">✓ Touch</button><button class="btn sm" data-act="editLead" data-id="${l.id}">Edit</button>`:`<button class="btn sm" data-act="editLead" data-id="${l.id}">View</button>`}</div></td></tr>`}).join('')}</tbody></table></div><p class="small muted">Sorted by score: price point, stage, recency, upcoming follow-up, open re-list window, minus missing compliance steps.</p>`}

function inputHtml(f,v,c,dis){const d=dis?'disabled':'';
 if(f.t==='check')return `<label class="chk"><input type="checkbox" name="${f.k}" ${v?'checked':''} ${d}><span>${esc(f.l)}</span></label>`;
 let ctl;if(f.t==='select'||f.t==='stage'){const o=f.t==='stage'?CATS[c].stages:f.o;const vals=v&&!o.includes(v)?[...o,v]:o;ctl=`<select name="${f.k}" ${d}>${f.t==='stage'?'':'<option value=""></option>'}${vals.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
 else if(f.t==='textarea')ctl=`<textarea name="${f.k}" rows="3" ${d}>${esc(v)}</textarea>`;
 else ctl=`<input name="${f.k}" type="${f.t}" value="${esc(v)}" ${f.req?'required':''} ${f.t==='number'?'step="any"':''} ${d}>`;
 return `<label class="fld ${f.w||''}"><span>${esc(f.l)}${f.req?' *':''}</span>${ctl}</label>`}
function openLead(c,id){const l=id?S.leads[id]:{cat:c,stage:CATS[c].stages[0],state:'PA',county:'Philadelphia',feePct:c==='referral'?25:null};const ed=canEdit(c);const fs=fieldsFor(c);
 openModal(`<form data-form="lead" data-cat="${c}" data-id="${id||''}"><div class="flex"><h2 class="sp">${id?(ed?'Edit':'View'):'New'} ${esc(CATS[c].sing)}</h2>${id?`<button type="button" class="btn sm" data-act="draft" data-id="${id}">Draft outreach</button>`:''}<button type="button" class="btn sm" data-act="close">✕</button></div>
 ${id&&warnings(l).length?`<div class="legal">${warnings(l).map(esc).join(' · ')}</div>`:''}
 ${c==='preforeclosure'?'<div class="note mt">Lead with help: share free counseling and the court diversion / mediation program before discussing a sale.</div>':''}
 ${c==='expired'?'<div class="note mt">Contact only after you confirm the prior listing agreement has ended.</div>':''}
 <div class="fgrid">${fs.map(f=>inputHtml(f,l[f.k],c,!ed)).join('')}</div>
 <div class="mfoot">${id&&ed?`<button type="button" class="btn danger" data-act="delLead" data-id="${id}">Delete</button><span class="sp"></span>`:''}<button type="button" class="btn" data-act="close">Cancel</button>${ed?'<button class="btn pri">Save</button>':''}</div></form>`)}
function readForm(fm,fs){const o={};for(const f of fs){const el=fm.elements[f.k];if(!el)continue;if(f.t==='check')o[f.k]=el.checked;else if(f.t==='number')o[f.k]=el.value===''?null:parseFloat(el.value);else o[f.k]=el.value.trim()}return o}
async function saveLead(c,id,data){const isNew=!id;const prev=id?S.leads[id]:{};const l={...prev,...data,cat:c,id:id||uid(),updatedAt:today(),by:S.user};
 if(isNew)l.createdAt=today();if(isClosed(l)&&!l.closedDate)l.closedDate=today();if(!isClosed(l))delete l.closedDate;
 if(isNew&&!l.nextFollow)l.nextFollow=today();
 await Store.put('leads',l);
 if(isNew&&S.settings.autoDrills){for(const [d,t] of CATS[c].cadence){const task={id:uid(),title:`${t} — ${l.name}`,due:addDays(today(),d),leadId:l.id,cat:c,owner:'carter',done:false};await Store.put('tasks',task)}}
 render();return l}

function sig(){const s=S.settings;const lic=[s.njLicense&&'NJ Lic. '+s.njLicense,s.paLicense&&'PA Lic. '+s.paLicense].filter(Boolean).join(' | ');
 return `\n\n${s.agentName}\nLicensed Real Estate Salesperson${lic?' ('+lic+')':''}\n${s.brokerage||'[ADD BROKERAGE NAME — required on all NJ & PA advertising]'}${s.brokerageAddress?' · '+s.brokerageAddress:''}${s.brokeragePhone?' · '+s.brokeragePhone:''}\n\nIf you’d prefer not to hear from me, just reply "unsubscribe" and I’ll remove you.`}
function draftFor(l){const fn=(l.name||'there').replace(/^SAMPLE\s*·\s*/,'').split(' ')[0];const a=l.area||'your property';const ag=S.settings.agentName;const b=S.settings.brokerage||'my brokerage';let s='',m='';
 switch(l.cat){
 case 'seller':s=`What ${a} could sell for right now`;m=`Hi ${fn},\n\nI’m ${ag} with ${b}. I put together a quick, no-pressure look at what homes like yours near ${a} have actually sold for recently. Whether you’re thinking about a move this year or just want to know your numbers, I’m happy to walk you through it in 15 minutes.\n\nWould a call later this week work?`;break;
 case 'buyer':s=`Your home search — next steps`;m=`Hi ${fn},\n\nGreat connecting. Here’s how I’d set up your search: a short consult to nail down areas and must-haves, a written buyer agreement so you know exactly how I’m paid and what I do for you, and a lender intro so you can move fast when the right place hits.\n\nWhat day works for a 20-minute consult?`;break;
 case 'luxury':s=`A private conversation about ${a}`;m=`Hi ${fn},\n\n${l.referredBy?l.referredBy+' suggested I reach out. ':''}I’m ${ag} with ${b}. I work with a small number of clients at the upper end of the Philadelphia market, where homes are moving quickly and discretion matters.\n\nIf it’s helpful, I’d be glad to share a private brief on recent sales and what buyers at this level are asking for. Coffee, a call, or just an email — whatever suits you.`;break;
 case 'commercial':s=`${l.ptype||'Commercial'} market check for ${a}`;m=`Hi ${fn},\n\nI’m ${ag} with ${b}. I’m tracking ${(l.ptype||'commercial').toLowerCase()} ${l.dealType==='Lease'?'lease rates':'sales'} around ${a} and put together a short market read. If you’re weighing a sale, lease renewal, or expansion in the next 12–24 months, I’d be glad to share it and hear what’s on your radar.\n\nOpen to a 15-minute call?`;break;
 case 'development':s=`Question about your parcel at ${a}`;m=`Hi ${fn},\n\nI’m ${ag} with ${b}. I work with builders and investors looking for sites in the area, and your property at ${a} came up in my research. If you’ve ever considered selling, or want to know what it could be worth to a developer, I’m happy to share what I’m seeing — no obligation.`;break;
 case 'expired':s=`About ${a}`;m=`Hi ${fn},\n\nI noticed ${a} is no longer on the market. If you’re still under an agreement with your agent, please disregard this note.\n\nIf you’re not, and you’re still hoping to sell, I’d love to show you a fresh plan: what buyers in your area are responding to right now, the price range that’s actually closing, and how I’d market it differently. Even if the answer is "not right now," you’ll walk away with useful numbers.\n\nWould a 15-minute call work this week?`;break;
 case 'preforeclosure':s=`Free resources for homeowners`;m=`Hi ${fn},\n\nI’m ${ag}, a local real estate agent with ${b}. Public records show your home may be in the foreclosure process, and I wanted to make sure you know about free help first:\n\n• HUD-approved housing counselors (free): consumerfinance.gov/find-a-housing-counselor\n${l.state==='PA'||l.county==='Philadelphia'?'• Philadelphia homeowners: Save Your Home Philly Hotline, 215-334-HOME (connects you to the court’s foreclosure diversion program)\n':''}${l.state==='NJ'?'• New Jersey Judiciary Foreclosure Mediation Program (free)\n':''}\nIf you ever decide selling makes sense, I can explain your options, including a traditional sale or a short sale. I’m not an attorney and can’t give legal advice, and there is never a fee to talk with me.\n\nWishing you the best either way.`;break;
 case 'investor':s=`Deals that fit your buy box`;m=`Hi ${fn},\n\nThanks for sharing your criteria — ${l.strategy||'your strategy'} in ${l.areas||'our area'} up to ${fK(l.value)}. I’ll send opportunities that actually match, not a firehose. Could you send proof of funds or a lender letter so I can share details with sellers when something fits?`;break;

/* ============ Game Plan & ROI ============ */
const ROI_DEF=[{n:'Current lane',price:350000,leads:40,appt:10,close:30,cost:150},{n:'Step-up lane',price:700000,leads:35,appt:9,close:28,cost:300},{n:'Luxury lane',price:1200000,leads:30,appt:8,close:25,cost:500}];
let ROI=clone(ROI_DEF);let ROI_NET=150000;
function roiCalc(r){const st=S.settings;const c=(+st.commissionPct||0)/100,sp=(+st.splitPct||0)/100;const deals=r.leads*12*(r.appt/100)*(r.close/100);const vol=deals*r.price;const g=vol*c;const net=g*sp;const cost=r.cost*12;return {deals,vol,g,net,cost,roi:cost?(net-cost)/cost:0,cpd:deals?cost/deals:0}}

 const volFor1M=c?1e6/c:0;const R=ROI.map(roiCalc);const maxNet=Math.max(...R.map(x=>x.net),1);
 const need=p=>c&&sp?ROI_NET/(p*c*sp):0;const ed=canEdit('plan');
 return `<div class="pagehead"><div><div class="kicker">Game Plan</div><h1>Ten-x the business, not the hours</h1><p>A “million-dollar agent” usually means $1M in volume. A million-dollar <i>business</i> means $1M in gross commission. They’re very different games.</p></div></div>

 <div class="card tile"><div class="lab">$1M gross commission needs</div><div class="val">${fK(volFor1M)}</div><div class="sub">in closed volume at ${st.commissionPct}% per side.</div></div>

 <div class="card mt"><div class="flex"><h2 class="sp">ROI projector</h2><span class="small muted">Commission ${st.commissionPct}% · her split ${st.splitPct}% (edit in Settings)</span></div>
 <p class="small muted">Leads worked per month → % that become appointments → % of appointments that close. Monthly cost = mailers, ads, events, tools (enter her real numbers).</p>
 <div class="tablewrap mt"><table class="roi" style="min-width:640px"><thead><tr><th></th>${ROI.map((r,i)=>`<th><input data-roi="${i}:n" value="${esc(r.n)}" ${ed?'':'disabled'} style="font-weight:700"></th>`).join('')}</tr></thead><tbody>
 ${[['price','Average sale price ($)'],['leads','New leads worked / month'],['appt','Lead → appointment %'],['close','Appointment → closing %'],['cost','Marketing + tools / month ($)']].map(([k,lab])=>`<tr><td>${lab}</td>${ROI.map((r,i)=>`<td><input type="number" step="any" data-roi="${i}:${k}" value="${r[k]}" ${ed?'':'disabled'}></td>`).join('')}</tr>`).join('')}
 <tr><td>Closings / year</td>${R.map(x=>`<td><b>${x.deals.toFixed(1)}</b></td>`).join('')}</tr>

 <tr><td>Gross commission</td>${R.map(x=>`<td>${f$(x.g)}</td>`).join('')}</tr>

 <div class="bars mt">${ROI.map((r,i)=>`<div class="b"><span>${esc(r.n)}</span><div class="t"><i style="width:${Math.max(2,R[i].net/maxNet*100)}%"></i></div><b class="right">${fK(R[i].net)}</b></div>`).join('')}</div>

 <div class="grid g4 mt">${[350000,700000,1200000,2000000].map(p=>`<div class="card tile"><div class="lab">${fK(p)} average</div><div class="val">${need(p).toFixed(1)}</div><div class="sub">closings / year</div></div>`).join('')}</div></div>
 <div class="grid g2 mt"><div class="card"><h2>The playbook to move up-market</h2><ol class="tight">

 <li><b>Own one city, block by block.</b> Center City, Rittenhouse, Society Hill, Fitler Square, Queen Village, Chestnut Hill and the river wards. Become the name owners think of first in two or three of them.</li>
 <li><b>Referral partners, not cold volume.</b> Wealthy clients come through CPAs, estate and divorce attorneys, and wealth advisors. Give them value (market briefs, great client care). No referral fees to unlicensed people.</li>
 <li><b>The athlete network.</b> Former D1 teammates, coaches, and sports-industry people relocating to Philly trust a fellow athlete. It fits the long-term goal of owning part of a Philly team.</li>
 <li><b>Professional circles.</b> Chambers, alumni groups, charity boards and LinkedIn. Target by profession and geography, never demographics.</li>

 <li><b>Auto-drills:</b> every new lead gets its follow-up schedule automatically (toggle in Settings).</li>

function complianceView(){const gaps=allLeads().filter(l=>warnings(l).length&&isActive(l));
 return `<div class="pagehead"><div><div class="kicker">Compliance</div><h1>Play by the rulebook</h1><p>Practical guardrails built into this CRM for NJ and PA. This is not legal advice — her broker of record and a real estate attorney have the final word, and rules change.</p></div></div>
 <div class="card"><h3>Open compliance steps (${gaps.length})</h3>${gaps.length?gaps.slice(0,40).map(l=>`<div class="flex" style="margin-top:6px"><a href="#" data-act="openLeadLink" data-id="${l.id}"><b>${esc(l.name)}</b></a><span class="muted small">${CATS[l.cat].label}</span>${warnings(l).map(w=>`<span class="warn">${esc(w)}</span>`).join('')}</div>`).join(''):'<p class="muted small">All clear.</p>'}</div>
 <div class="grid g2 mt"><div class="card"><h2>New Jersey</h2><ul class="tight">
 <li><b>Consumer Information Statement (CIS)</b> at first substantive contact — once talk turns to a specific property, needs, motivation or finances — before confidential info is shared.</li>
 <li><b>Advertising</b> must include the brokerage’s registered business name, more prominent than her own name; team names must include the brokerage (N.J.A.C. 11:5-6.1).</li>
 <li><b>Foreclosure Rescue Fraud Prevention Act</b> (N.J.S.A. 46:10B-53 et seq.): licensing for foreclosure consultants, strict rules for “sell and stay” deals, and criminal penalties for patterns of rescue fraud. Lease-backs = attorneys first.</li>
 <li><b>Law Against Discrimination</b> covers more classes than federal law (including source of lawful income). Market by property and geography only.</li>
 <li><b>All pay through her broker</b>, including referral fees in or out.</li></ul></div>
 <div class="card"><h2>Pennsylvania</h2><ul class="tight">
 <li><b>Consumer Notice</b> at the initial interview — the first substantive discussion about real estate needs. If it happens by phone, give the oral notice, then the written one at the first meeting. A website form with property details can trigger it.</li>
 <li><b>Referral fees</b> only to licensees, through her employing broker, in writing; fees to active licensees in other states are allowed; never to unlicensed people (RELRA).</li>
 <li><b>Turf state:</b> out-of-state agents can’t work PA deals without a PA license, which is why out-of-area clients get referred instead.</li>
 <li><b>Philadelphia foreclosures</b> run through the court’s Residential Mortgage Foreclosure Diversion Program for owner-occupants. Point homeowners there first.</li>
 <li><b>Advertising</b> must identify her employing broker (State Real Estate Commission rules).</li></ul></div>
 <div class="card"><h2>Federal & industry</h2><ul class="tight">
 <li><b>Fair Housing Act:</b> no steering, no targeting or excluding by protected class. Market by property, price and place — never by people’s characteristics.</li>
 <li><b>TCPA & Do-Not-Call:</b> scrub against the National DNC Registry (and state lists) before cold calls; no autodialed or prerecorded calls/texts to cell phones without prior express written consent.</li>
 <li><b>CAN-SPAM:</b> honest subject lines, brokerage identification, a physical address, and a working opt-out honored promptly. The templates include these; add the address in Settings.</li>
 <li><b>RESPA §8:</b> no referral fees or kickbacks with lenders, title or other settlement providers.</li>
 <li><b>Buyer agreements:</b> written agreement before touring (MLS/NAR practice since Aug 2024).</li>
 <li><b>Code of Ethics Art. 16</b> (REALTOR® members): don’t solicit owners under an active exclusive listing — the reason the Expired tab demands verification.</li></ul></div>
 <div class="card"><h2>Data & lists</h2><ul class="tight">
 <li>Use only data she is licensed to use (MLS, public records, her own contacts). Follow MLS rules on exporting data.</li>
  <li>This site is public code with no passwords or keys inside it; her data stays in her own browser.</li>
 <li>Don’t buy or scrape personal cell numbers to text without consent.</li></ul>
 <p class="small muted">Sources: NJ Real Estate Commission rules (N.J.A.C. 11:5), N.J.S.A. 46:10B-53 et seq., PA RELRA (63 P.S. §455), PA REALTORS® referral guidance, Philadelphia Court of Common Pleas diversion program.</p></div></div>`}

function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else{if(ch==='"')q=true;else if(ch===','){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()!==''))}
const MAP_FIELDS=[['name',/^(full ?name|name|contact( name)?|owner( name)?)$/i],['firstName',/first ?name/i],['lastName',/last ?name|surname/i],['email',/^(e-?mail|email address|work email|person email)$|email$/i],['phone',/mobile|direct|cell|^phone|phone number|corporate phone/i],['area',/address|street|property|location/i],['city',/^city$|person city/i],['state',/^state$|person state/i],['county',/county/i],['value',/list ?price|original price|^price|value|budget|amount/i],['title',/^title$|job title/i],['company',/company|organization|account name/i],['linkedin',/linkedin/i],['offDate',/off.?market|expir|withdraw|cancel|status date/i],['dom',/^dom$|days on market|cdom/i],['notes',/^notes?$|comments?/i]];
let CSV={rows:[],cat:'seller'};
function openImport(c,text){const rows=parseCSV(text);if(rows.length<2){toast('That CSV looks empty.','err');return}CSV={rows,cat:c};const h=rows[0];
 const guess=re=>{const i=h.findIndex(x=>re.test(String(x).trim()));return i};
 openModal(`<form data-form="import"><div class="flex"><h2 class="sp">Import ${rows.length-1} rows → ${CATS[c].label}</h2><button type="button" class="btn sm" data-act="close">✕</button></div>
 <p class="small muted">Match the CSV columns to CRM fields. Most MLS and spreadsheet exports are pre-matched.</p>
 <div class="fgrid">${MAP_FIELDS.map(([k,re])=>{const g=guess(re);return `<label class="fld"><span>${k}</span><select name="m_${k}"><option value="-1">—</option>${h.map((x,i)=>`<option value="${i}" ${i===g?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}).join('')}
 <label class="fld"><span>Lead source</span><select name="source">${SRC_BASE.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label>
 <label class="fld"><span>Default state</span><select name="defState"><option value="">From file</option><option>NJ</option><option>PA</option></select></label></div>
 <div class="legal">Imported phone numbers are marked <b>not yet DNC-checked</b>. Scrub them before calling.${c==='expired'?' Expired imports are marked <b>unverified</b> until you confirm each agreement ended.':''}</div>

 for(const r of data){const name=g(r,'name')||[g(r,'firstName'),g(r,'lastName')].filter(Boolean).join(' ')||g(r,'company')||g(r,'area');if(!name)continue;
  let st=(defSt||g(r,'state')).toUpperCase();st=/^(NJ|NEW JERSEY)$/.test(st)?'NJ':/^(PA|PENNSYLVANIA)$/.test(st)?'PA':st?'Other':'';
  const off=g(r,'offDate');const od=off&&!isNaN(new Date(off))?ymd(new Date(off)):'';
  const notes=[g(r,'title')&&g(r,'company')?g(r,'title')+' @ '+g(r,'company'):g(r,'title')||g(r,'company'),g(r,'linkedin'),g(r,'notes')].filter(Boolean).join('\n');
  const l={id:uid(),cat:c,name,email:g(r,'email'),phone:g(r,'phone'),area:[g(r,'area'),g(r,'city')].filter(Boolean).join(', '),state:st,county:g(r,'county'),value:num(g(r,'value')),stage:CATS[c].stages[0],source:src,notes,createdAt:today(),updatedAt:today(),nextFollow:today(),dncChecked:false,by:S.user};
  if(c==='expired'){l.offDate=od;l.dom=num(g(r,'dom'));l.offStatus='Expired';l.reason='Unknown';l.verified=false}
  await Store.put('leads',l);n++}
 render();toast(`Imported ${n} ${CATS[c].label.toLowerCase()}.`)}

function download(name,text,type){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}

function toCSV(){const keys=['cat','name','stage','value','phone','email','area','county','state','source','nextFollow','lastContact','closedDate','notes'];const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;return [keys.join(','),...allLeads().map(l=>keys.map(k=>q(l[k])).join(','))].join('\n')}

/* ============ modal & toast ============ */

 const d=document.createElement('div');d.className='affirm';d.innerHTML=`<div class="k">★ HALFTIME TALK</div><p>${esc(AFFIRM[i])}</p><button class="btn gold sm">Locked in</button>`;d.querySelector('button').onclick=()=>d.remove();$('#toasts').appendChild(d);setTimeout(()=>d.remove(),60000)}

  if(!ok){toast('Wrong PIN.','err');fm.elements.pin.value='';return}S.user=who;try{sessionStorage.setItem(LS+'_u',who)}catch(err){}render();if(who==='carter'&&S.settings.affirm)setTimeout(affirm,1200);if(!stored)toast('Using the default PIN — change it in Settings.');return}
