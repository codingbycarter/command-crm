<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Command CRM — Wholesale Desk</title>
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">Command CRM</div>
    <div class="sub">Wholesale Desk · NJ / Philadelphia</div>
    <a class="nav" href="#dashboard">Dashboard</a>
    <a class="nav" href="#deals">Deal pipeline</a>
    <a class="nav" href="#buyers">Investors & buyers</a>
    <a class="nav" href="#sellers">Seller leads</a>
    <a class="nav" href="#analyzer">Deal analyzer</a>
    <a class="nav" href="#outreach">Outreach drafts</a>
    <a class="nav" href="#tasks">Follow-ups & tasks</a>
    <a class="nav" href="#compliance">Compliance</a>
    <a class="nav" href="#data">Import / export</a>
    <div style="margin-top:20px;padding:0 8px">
      <button id="themeBtn" style="width:100%">Toggle dark mode</button>
      <p class="muted" style="font-size:11px;margin-top:10px">Data is saved in this browser only. Use Import / export to back up or move it.</p>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <input id="search" placeholder="Search buyers, deals, sellers…  ( / )">
      <span class="spacer"></span>
      <button id="quickDeal" class="primary">+ Deal</button>
      <button id="quickBuyer">+ Investor</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="modalRoot"></div>
<script src="app.js"></script>
</body>
</html>
